<!-- index.html -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fix It</title>

  <link rel="stylesheet" href="style.css">

  <!-- ICONS -->
  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

  <!-- LOGIN PAGE -->

  <div class="login-page" id="loginPage">

    <div class="login-box">

      <h1>Fix It</h1>

      <p>Mobile & Laptop Service</p>

      <input type="text" id="username"
      placeholder="Enter Name">

      <input type="number" id="mobile"
      placeholder="Enter Mobile Number">

      <button onclick="login()">
        Login
      </button>

    </div>

  </div>

  <!-- WEBSITE -->

  <div class="website hidden" id="website">

    <!-- TOPBAR -->

    <header>

      <h2 id="pageTitle">My Requests</h2>

    </header>

    <!-- MY REQUEST -->

    <section class="page active" id="requestPage">

      <div class="request-grid">

        <div class="request-card">

          <div class="card-top">

            <h3>Mobile</h3>

            <span class="priority">High</span>

          </div>

          <p class="problem">
            Lap display issue
          </p>

          <div class="card-details">

            <p>
              <i class="fa-solid fa-location-dot"></i>
              Home Service
            </p>

            <p>
              <i class="fa-regular fa-calendar"></i>
              21/04/2026
            </p>

            <p>
              <i class="fa-solid fa-screwdriver-wrench"></i>
              Scheduled: 24/04/2026
            </p>

          </div>

          <div class="status-row">

            <span class="submitted">
              Submitted
            </span>

            <span class="payment">
              Not Paid
            </span>

          </div>

        </div>

      </div>

    </section>

    <!-- NEW REQUEST -->

    <section class="page" id="newRequestPage">

      <div class="form-box">

        <h2>Book Service</h2>

        <input type="text" id="deviceName"
        placeholder="Device Name">

        <select id="serviceType">
          <option>Select Service</option>
          <option>Mobile Repair</option>
          <option>Laptop Repair</option>
        </select>

        <select id="priorityType">
          <option>Priority</option>
          <option>Low</option>
          <option>Medium</option>
          <option>High</option>
        </select>

        <input type="text" id="addressInput"
        placeholder="Address">

        <textarea id="problemInput"
        placeholder="Problem Description"></textarea>

        <button type="button" onclick="submitRequest()">Submit Request</button>

      </div>

    </section>

    <!-- PROFILE -->

    <section class="page" id="profilePage">

      <div class="profile-box">

        <div class="profile-top">

          <div class="profile-icon">
            <i class="fa-solid fa-user"></i>
          </div>

          <h3 id="profileName">
            USER
          </h3>

        </div>

        <div class="profile-details">

          <div class="profile-item">

            <i class="fa-regular fa-user"></i>

            <div>
              <span>Name</span>
              <p id="userNameText"></p>
            </div>

          </div>

          <div class="profile-item">

            <i class="fa-solid fa-phone"></i>

            <div>
              <span>Mobile</span>
              <p id="mobileText"></p>
            </div>

          </div>

          <div class="profile-item">

            <i class="fa-regular fa-calendar"></i>

            <div>
              <span>Member Since</span>
              <p>21/04/2026</p>
            </div>

          </div>

        </div>

        <button class="logout-btn"
        onclick="logout()">
          Logout
        </button>

      </div>

    </section>

    <!-- BOTTOM NAVBAR -->

    <nav class="bottom-nav">

      <div class="nav-item active-nav"
      onclick="showPage('requestPage','My Requests',this)">

        <i class="fa-regular fa-clipboard"></i>

        <span>Requests</span>

      </div>

      <div class="nav-item"
      onclick="showPage('newRequestPage','New Request',this)">

        <i class="fa-solid fa-plus"></i>

        <span>New</span>

      </div>

      <div class="nav-item"
      onclick="showPage('profilePage','Profile',this)">

        <i class="fa-regular fa-user"></i>

        <span>Profile</span>

      </div>

    </nav>

  </div>

  <script src="script.js"></script>

</body>
</html>
