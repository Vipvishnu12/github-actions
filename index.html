<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Study Page</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            text-align: center;
            background: #1e293b;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0px 0px 20px rgba(0,0,0,0.4);
        }

        h1 {
            color: #38bdf8;
            font-size: 40px;
        }

        p {
            font-size: 20px;
            margin-top: 10px;
        }

        .tag {
            margin-top: 20px;
            padding: 10px 20px;
            background: #38bdf8;
            color: black;
            border-radius: 20px;
            display: inline-block;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome to DevOps Learning 🚀</h1>

        <p>
            This page is deployed using
            GitHub Actions + NGINX + EC2
        </p>

        <div class="tag">
            CI/CD Pipeline Successful ✅
        </div>
    </div>

</body>
</html>
